# Une seule origine pour les deux services que `@supabase/supabase-js` attend derrière une
# même URL : il construit `SUPABASE_URL/auth/v1/...` pour l'authentification et
# `SUPABASE_URL/rest/v1/...` pour les tables. C'est le rôle que Kong tient dans la pile
# Supabase hébergée ; nginx suffit ici, chaque service vérifiant lui-même les jetons.
#
# Rien d'autre n'est routé : cette origine n'est pas une API publique, elle n'est
# joignable que depuis le réseau du compose.

server {
  listen 8000;
  server_name _;

  # Connexions et enrôlements : quelques kilo-octets suffisent.
  client_max_body_size 1m;

  # Journalisation sans le corps ni les en-têtes : ils portent mots de passe et jetons.
  access_log /var/log/nginx/access.log combined;

  location /auth/v1/ {
    proxy_pass http://auth:9999/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Sonde du compose : ne dit rien des services derrière, seulement que nginx écoute.
  location = /sante {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location / {
    return 404;
  }
}
