name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @radar/scoring typecheck
      - run: pnpm exec nuxt typecheck
      # Migration + seed + parcours API sur Postgres WASM (PGlite), aucune DB externe requise
      - run: pnpm test
      - run: pnpm build
      - name: Aucun secret dans le bundle client
        run: '! grep -rE "SUPABASE_SERVICE|service_role|DATABASE_URL=postgres" .output/public'

      # `app/` ne doit jamais importer @radar/scoring : son index de module embarque
      # options.json, donc les constats commerciaux internes (difficulté, hypothèse,
      # relance, gravité) destinés à la seule fiche prospect admin.
      - name: Aucun contenu du moteur dans le bundle client
        run: |
          ! grep -rlE "Difficulté précise|Question de relance|Utilisation commerciale" .output/public
          ! grep -rl "Le prospect se projette" .output/public
          ! grep -rnE "(from|import\()[[:space:]]*['\"]@radar/scoring" app/
